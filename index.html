<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">友情链接 - EdgeOne</title>
  <meta name="description" id="page-desc" content="连接彼此，共享价值">
  <link rel="icon" id="site-favicon-link" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Cloudflare Turnstile Script -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <!-- Ambient background glow -->
  <div class="bg-ambient"></div>

  <div class="container">
    <!-- Header Bar -->
    <header class="header-bar">
      <a href="/" class="site-brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </div>
        <span class="brand-title" id="site-brand-title">友情链接</span>
      </a>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="btn-icon" title="切换深色/浅色模式" aria-label="Toggle Theme">
          <span id="theme-toggle-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </span>
        </button>

        <!-- Login Entry (Requirement 2) -->
        <button id="btn-login-entry" class="btn btn-secondary" title="管理登录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>管理</span>
        </button>
      </div>
    </header>

    <!-- Hero / Headline Section -->
    <section class="hero-section">
      <h1 class="hero-title" id="hero-title">友情链接</h1>
      <p class="hero-desc" id="hero-desc">连接彼此，共享价值</p>
    </section>

    <!-- Part 1 (Top Part): 联盟 (Unions) -->
    <section id="section-unions" class="content-section" style="margin-bottom: 3.5rem;">
      <div class="section-head" style="margin-top: 0;">
        <h2 class="section-title">
          <span>博客联盟</span>
          <span id="unions-count" class="section-count">0</span>
        </h2>
      </div>
      <div id="unions-container" class="unions-badges">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Part 2 (Bottom Part): 友情链接 (Friend Links) with 3 Styles -->
    <section id="section-links" class="content-section">
      <div class="section-head">
        <h2 class="section-title">
          <span>友情链接</span>
          <span id="links-count" class="section-count">0</span>
        </h2>

        <!-- Style Switcher: 简约 | 详情 | 应用 -->
        <div class="style-switcher" id="links-style-switcher">
          <button type="button" class="style-btn" data-style="simple" title="简约风格">简约</button>
          <button type="button" class="style-btn active" data-style="detailed" title="详情风格">详情</button>
          <button type="button" class="style-btn" data-style="app" title="应用风格">应用</button>
        </div>
      </div>

      <div id="links-container" class="links-grid style-detailed">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
      <div>
        <span>基于 Tencent EdgeOne Makers 构建</span>
      </div>
      <div class="footer-links">
        <a href="/api/public/links" target="_blank" rel="noopener">公开 API ↗</a>
        <a href="/admin.html">管理控制台</a>
      </div>
    </footer>
  </div>

  <!-- Login Modal (Opened via Login Entry) -->
  <div id="login-modal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 0.6rem;">
          <div class="brand-icon" style="width: 28px; height: 28px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </div>
          <h2 class="modal-title">管理控制台登录</h2>
        </div>
        <button type="button" id="modal-close-btn" class="modal-close" aria-label="关闭">&times;</button>
      </div>

      <!-- Login Error Alert -->
      <div id="login-error" style="display: none; padding: 0.65rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; color: #ef4444; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.25); margin-bottom: 1.25rem; text-align: left;"></div>

      <form id="portal-login-form">
        <div class="form-group" style="text-align: left;">
          <label class="form-label" for="portal-password">管理密码</label>
          <input type="password" id="portal-password" class="form-input" placeholder="输入管理密码" required autocomplete="current-password">
        </div>

        <!-- Cloudflare Turnstile Container (Conditional based on system settings) -->
        <div id="turnstile-group" class="form-group" style="display: none; justify-content: center; min-height: 65px; margin: 1.25rem 0;">
          <div id="turnstile-container"></div>
        </div>

        <input type="hidden" id="cf-turnstile-token">

        <button type="submit" id="portal-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; margin-top: 0.5rem;">
          登 录
        </button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
